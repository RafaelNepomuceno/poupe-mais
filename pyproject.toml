[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poupe-mais"
dynamic = ["version"]
description = "Controle financeiro pessoal pela linha de comando"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rafael Nepomuceno" }]

[project.scripts]
poupe = "poupe_mais.cli:main"

[tool.setuptools]
packages = ["poupe_mais"]

# A versão fica definida em um único lugar: poupe_mais/__init__.py
[tool.setuptools.dynamic]
version = { attr = "poupe_mais.__version__" }
